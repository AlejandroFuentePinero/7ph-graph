# Actions only. The Python packages are not bumped here: a gradio bump also needs the
# Space card's `sdk_version` edited by hand (tests/test_deploy.py holds the two together),
# so every such PR would arrive red. Security fixes for them are the job of Dependabot
# alerts and security updates, repo settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A release waits a week before it is proposed, so one pulled for being bad never is.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
