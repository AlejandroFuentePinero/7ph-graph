# Source repairs: rulings about upstream's own records (issue #268).
#
# The build applies these to every snapshot as it is loaded, before the ingest
# gate compares anything and before any build guard runs, so the snapshot the
# build sees is the repaired one. Every entry keys on deck ids (the source's
# stable identifier), carries a one-line `reason`, and names in `as_of` the
# snapshot the ruling was written against. An entry whose decks no snapshot
# holds is reported as dead in the reconciliation report, never fatal; a deck
# whose source filing changes under its repair from `as_of` on is reported
# there as moved, since the gate cannot see it (issue #278); a file that
# contradicts itself aborts the build.
#
# Three kinds:
#
#   [[hold_out]]   keep these decks out of the graph, from every snapshot
#     decks = ["<deckId>", ...]
#
#   [[refile]]     move these decks to an event the source does not have. The
#                  entry states the event's type and, where the owner knows it,
#                  its field; a stated field reaches the graph under this kind's
#                  rule name (Event.fieldImputed = "refiled"), never as the
#                  source's own count, and the decks' norms are re-scored against
#                  it (Deck.normImputed = "refiled"). Leave `field` out where the
#                  owner does not know it and the build's field rules decide. A
#                  deck that belongs at an event the source *does* have is a
#                  [[deck_event]] in pilots.toml, not a refile.
#     decks = ["<deckId>", ...]
#     event = "VFNIQ26"
#     event_type = "Tournament"
#     field = 49
#
#   [[adopt]]      adopt a value for one of a deck's immutable facts (`pilot`,
#                  `placement`, `createdAt`), where upstream rewrote it in a later
#                  fetch and the rewrite is right. Carried into every snapshot
#                  that holds the deck, so the gate reads one fact instead of
#                  flagging the rewrite and pinning the old value.
#     decks = ["<deckId>"]
#     fact = "pilot"
#     value = "<pilotId>"
#
# Every kind also takes:
#     reason = "one line"
#     as_of = "20261104T091012Z"

[[hold_out]]
# GufBendigoIQ arrives with 25 decks for a 24-player field and three rank-1
# titles; this deck (01st Peter K, Grixis) is the extra one, and the sole-winner
# guard aborts the build while it is in (issues #253, #258, #262). Upstream had
# not refiled it as of this snapshot.
decks = ["x9Xnl2Z0bESr-A5jvLBeVw"]
reason = "GufBendigoIQ seats 25 decks for a 24-player field with three rank-1 titles; this deck is the extra one (#253, #258, #262)"
as_of = "20261104T091012Z"

