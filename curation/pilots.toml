# Alejandro D's HighlanderWorlds26 deck (8pt, 91st): the source title read
# "Blue Moon", so the classifier made engine:blue_moon primary (85) over
# engine:izzet_prowess (15). The list is UR Izzet Prowess (Monastery Swiftspear,
# Dragon's Rage Channeler, Sprite Dragon, Slickshot Show-Off, Stormwing Entity,
# Cori-Steel Cutter, Ragavan, Murktide), owner-confirmed. Reclassify to the
# UR Prowess convention.
deck = "NEAr5sy1kEy5cwFUGhEa_A"
deck_name = "UR Prowess"
engine = "engine:izzet_prowess"
engine_label = "Izzet Prowess"

[[deck_archetype]]
# Henry F's 88WADJuly deck (10th), titled "Amber Ascendency". The misspelling is
# what the tagger tripped on: it matched only the generic engine:ascendancy and
# gave it weight 100, which no other deck in the corpus carries as a primary.
# The seven real Amber Ascendancy decks all carry engine:amber_ascendancy at 50
# primary with engine:ascendancy at 50 beside it, and 11 further decks carry the
# bare tag only as a secondary.
#
# The cards settle it without leaning on the title at all: this deck's seven
# closest lists in the whole corpus are exactly those seven Amber Ascendancy
# decks, from 0.63 (ANZSS11) to 0.765 (SydneyShowdown26), with nothing else
# reaching them. Collapse it onto the single corrected engine, which is what
# every archetype figure counts (ADR 0023), and correct the deck name to the
# convention its sisters use.
deck = "J4CqDvaCPkO4LeCxJgBydQ"
deck_name = "Amber Ascendancy"
engine = "engine:amber_ascendancy"
engine_label = "Amber Ascendancy"

# --- Decks stranded at a malformed event, returned to their cohort (issue #167) ---

[[deck_event]]
# Mitch H's (FrostyCyanGecko) "38th - 8pt Reckless Red (Mono R Aggro) - ": the
# only deck of 4592 whose event is a stringified NaN, with a null eventId and a
# title whose separator dangles where the event name should be. It belongs to
# CBR3:
#   1. CBR3 claims a field of 63 and the source records 62 decks for it. Its
#      placements run 1..63 with one genuine hole in the body, 38th, which is
#      this deck's placement. (The 4-8 gaps are the usual tie-band titles.)
#   2. Dated 2024-03-24, inside CBR3's window; all 62 CBR3 decks fall in it. The
#      only other field-38 candidate, Masters2024, is June 2024 and has no hole
#      at 38.
#   3. The pilot's event history is the CanBrawl series (CBR Aug 23, CBR Oct 23,
#      CanBrawl 23, CanBrawl2); he has no deck at CBR3 yet.
# The claimed eventSize of 38 is this deck's own placement copied into the size
# field, which is what scored him 38-of-38 (norm 1.0, dead last) at an event
# that never happened. Moving him drops that claim with the rest of the phantom
# event's numbers and re-scores him 38-of-63 against CBR3's counted field.
deck = "FZP9B6alz0OoUVVe74nHeA"
