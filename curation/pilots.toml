[[reject]]
# Sam L != SamL5, Sam L != SamL21, SamL5 != SamL21 (issue #208 re-adjudicated all
# three; the middle pair is restored from under a merge that overturned it). One
# named pilot and two numbered handles that appear only at ETEAE, an event Sam L has
# no registration of his own at. SamL5's RW Legends is 0.74 to Sam L's own, SamL21's
# BUG Reanimator 0.72 to his, and the two handles are 0.03 to each other.
#
# The reasoning on both sides of this was wrong, so it is worth recording what does
# not work. "Both at ETEAE, therefore two people" does not hold: this dictionary
# merges Zachary M / Zachaery M and James L / JamL9 across a shared ETEAE
# registration, and one person's two decks at one event overlap 0.07 and 0.25 there,
# which is what 0.03 looks like. So all three ids being one Sam L is not excluded.
#
# Deck overlap does not decide it either. Matched for date gap and colour identity,
# SamL5 sits at the 95th percentile of different-pilot pairs and SamL21 at the 88th,
# so if either is Sam L it is SamL5 rather than the SamL21 that was merged; but that
# is a two-fold likelihood at best, and calibrating overlap against this file's own
# decisions leaves it no discriminating power: of the 31 pairs rejected before this
# entry, five sat at or above 0.72 and the top four ran 0.94 to 1.00, while 52% of
# merged pairs sat below 0.72. A single threshold on overlap classifies the curators'
# own calls no better than always merging does. Counted as the file stood before this
# entry on purpose: the two pairs it adds are themselves 0.74 and 0.72, so counting
# them would be citing this decision as evidence for itself.
#
# Note what that leaves standing against these rejects, because it is the real
