# --- Examined and left undecided: the pass over the multi-name queue (issue #232) ---
#
# The 28 ids `multi_name_ids` held after the pass above, every one read and recorded
# here. This queue asks the other identity question: `under_merges` is several ids that
# may be one person, this is one id whose decks recovered several surnames and may
# therefore be several people (issue #39). From here an unexamined entry in either
# queue means nobody has looked yet, and
# tests/test_curation_report.py::test_the_live_brief_states_exactly_what_the_live_report_holds
# holds that each reaches the curation brief, across both (issue #270).
#
# One derived fact runs under the whole pass and decides its shape: 25 of the 28 are
# the shadow of a [[merge]] recorded above. The scan reads each id AFTER this file is
# applied, so a merge that folded "Ari Steel" onto "Ari S" leaves one id recovering two
# surnames, and the queue re-poses the question that merge answered. Two ids carry
# several surnames from the source alone (William LM and Max DK), and one more
# (SilentGreenLynx) owes its second family to a null-pilot deck a [[deck_pilot]] routed
# here, whose title left an archetype word where the surname goes.
#
# So no row here is decidable on fresh reasoning: for 25 the decision is on file with
# its own evidence, and re-deciding it from that same evidence is not a second opinion.
# What the hold buys is the watch. A false merge is the irreversible error (#229), and
# the one fact that would refute one of these is the id's two surnames registering at
# one event, where only one person can have entered (ADR 0005). That is the
# `event_split` trigger, re-evaluated against every hold on every ingestion, so from
# here these merges are watched rather than only recorded. None fires today: no id in
# the queue has two of its surnames at one event, which is also why no row could be
# decided against a structural fact this round.
#
# What settles a row is not a [[reject]], there being no second id to reject, but a
# [[deck_pilot]] moving the minority decks to their real owner, or the [[merge]] behind
# the row being reversed. Neither is available today: no name in this queue exists
# elsewhere in the corpus as its own pilot, so there is no id to move a deck to.
#
# Each entry below reads `A ? B` for the same reason the pass above does: the row is a
# question this file records rather than answers, against the `=` of a merge and the
# `!=` of a reject. Here the two sides are two names on one id, not two ids.
#
# Counts and spellings are read across the whole id, numbered careers included, for the
# reason the pass above gives: a hold names a whole identity, and a career inside one is
# not an answer to who the id is. They are also read at the id and not at the pilot node
# it ends up in, which is the population the scan itself reads: the identical-name join
# (ADR 0007) folds other ids onto that node afterwards, so a recount taken there can be
# higher (Ben H's node carries a joined id's decks, Max DK's a null-bucket orphan's).
#
# `as_of` is the 2026-08-15 snapshot throughout, the corpus every line below was written
# against. `settles_on` reads `event_split` where the id is still registering in 2026,
# so its spellings could still meet at one event, and `new_decks` for the three whose
# last deck is 2025, where nothing can meet until the id registers again.

