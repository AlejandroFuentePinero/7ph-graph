# shared event below is a single Tournament, and at it the two ids field *different*
# decks (the highest shared-event overlap in the whole set is 0.28). Where a pair
# also scores high at other events, that is a netdecked archetype, which ADR 0005
# rules is community list-sharing rather than identity.
