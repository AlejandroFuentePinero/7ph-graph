# Curated pilot-identity decisions (issue #9).
#
# The build reads this on every rebuild and applies it deterministically, so a
# decision recorded once holds for all time. Every entry keys on a STABLE
# upstream identifier: a pilot id or a deck id. Never key on a display name or a
# synthetic key (nan:darcy, LunarRedFalcon#2): those shift when the data changes.
#
# Wave 1 policy: only decisions grounded on a hard fact go here. When two names
# could reasonably be two different people, they stay separate and remain a
# proposal in the reconciliation report until a human confirms them (the second
# sweep). See docs/adr/0004-pilot-identity.md.
#
# Eight kinds of entry. Seven record a decision; the eighth records that one could
# not be reached. Upstream reuses a pilot id for a different person (issue #261),
# so each of the seven also carries the snapshot it was written on and the display
# name each of its ids recovered then (the name the deck titles gave, not a pinned
# one; for a deck id, its own title's name). The build refuses an entry whose id
# no longer recovers that name's family (a handle or bare first name, the string),
# applies it to nothing, and lists it under a banner (issue #283). Both fields are
# required; `uv run python scripts/entry_provenance.py` fills them in for every
# entry lacking them, from the earliest snapshot holding its ids.
#
#     as_of = "20260713T232944Z"
#     names = { "A" = "Alex W", "B" = "Alexander W" }
#
#   [[merge]]        collapse several ids onto one person (transitive)
#     ids = ["A", "B", "C"]   # every upstream id that is this person
#     canonical = "A"         # the id the merged Pilot node keeps (one of `ids`)
#
#   [[reject]]       these ids are NOT the same person; stop re-proposing them
#     ids = ["A", "B"]
#
#   [[split]]        these ids share a display name but are different people;
#                    keep the identical-name join from fusing them (inverse of
#                    merge). Split every id in a same-name group you separate:
#                    splitting only some leaves the rest transitively re-fusing
#                    them, which aborts the build.
#     ids = ["A", "B"]
#
#   [[name]]         pin a display name over the majority vote
#     pilot = "CleverBlueWhale"
#     display_name = "Alejandro D"
#
#   [[deck_pilot]]   reassign one deck to its real pilot id (e.g. a null deck)
#     deck = "<deckId>"
#     pilot = "<pilotId>"
#
#   [[deck_archetype]] reclassify one deck whose source title mislabelled it
#     deck = "<deckId>"
#     deck_name = "UR Prowess"          # the corrected display name
#     engine = "engine:izzet_prowess"   # the single engine it belongs to
#     engine_label = "Izzet Prowess"    # that engine's label
#
#   [[deck_event]]   return one deck to the event it was really played at (e.g.
#                    a deck the source stranded at a malformed event). The event
#                    must be one the snapshot holds; the deck adopts that
#                    cohort's field and is re-scored against it. An event the
#                    source does not have is a [[refile]] in repairs.toml.
#     deck = "<deckId>"
#     event = "CBR3"
#
#   [[hold]]         one id, examined and left undecided: its own decks recovered
#                    several surnames and it may be several people. Applies
#                    nothing to the graph: it moves the id off the unexamined
#                    multi-name queue and onto the held list, carrying the
#                    reasoning (in the comment) and the condition the build
#                    re-evaluates every ingestion. What would settle it is the id
#                    registering at one event under two of its names
#                    (`event_split`), and what would resolve it is a [[deck_pilot]]
#                    moving the minority decks to their owner, never a [[reject]]
#                    -- there is no second id. Name the id a [[merge]] leaves
#                    standing, not one it folds away: the queue reports the
#                    canonical, so a hold on a member examines nothing (the build
#                    refuses it). Upgrading a hold means replacing it with the
#                    decision, never appending one beside it.
#
#                    A hold on a PAIR is refused at load (issue #273): the build
#                    derives every candidate pair's state by rule, merged,
#                    separated or watching (ADR 0028), so there is no pair queue
#                    to park a pair in. The 96 pair holds this file carried to
#                    2026-11-06, and their reasoning, are in git history.
#     ids = ["A"]
#     settles_on = "event_split"      # what the writer expects would decide it
#     as_of = "20260815T140746Z"      # the snapshot the reasoning was written against

# --- Names pinned against the vote (no derivable relation, human-confirmed) ---

